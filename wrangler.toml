# Cấu hình dùng cho CẢ local (`npm run dev`) LẪN deploy bản demo cá nhân qua Cloudflare
# Worker: nexrall-netviet-sales-os → https://nexrall-netviet-sales-os.tonypham090703.workers.dev
# Mọi ID dưới đây thuộc account Tonypham090703@gmail.com (bf1f00ccb790b51fcb25ed451f903773).
#
# Bản chính thức của công ty (nexrall-netviet-sales-os1, account Trungductwice@gmail.com) nằm ở repo
# github.com/trungducnguyen4/nexrall-netviet-sales-os1, dùng wrangler.toml RIÊNG với ID của account đó
# và được Workers Builds tự deploy khi push. Khi chép code sang repo công ty: chép mọi file TRỪ wrangler.toml.

name = "nexrall-netviet-sales-os"
account_id = "bf1f00ccb790b51fcb25ed451f903773"
main = "local/entry.js"
compatibility_date = "2026-09-01"

# Front-end tĩnh (index.html + src/ + styles/) được build vào ./public
# Request không khớp file tĩnh sẽ rơi vào Worker (/api/*)
[assets]
directory = "./public"
not_found_handling = "single-page-application"


# D1 Database
# Local:
#   wrangler dev --local
# Production:
#   wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "netviet-sales-os"
database_id = "79b5d7cc-4121-499e-bab0-cbbdabc53221"


# Cloudflare KV
[[kv_namespaces]]
binding = "SHARED_KV"
id = "3c09fbd8cbd24f0aa11150366b80892e"


# Cloudflare R2
# Lưu file gốc: báo giá / hợp đồng / tài liệu Sales Kit
[[r2_buckets]]
binding = "DOCS"
bucket_name = "netviet-sales-os-docs"


# Cron Trigger
# M10 Automation: mỗi 30 phút gọi /api/__cron
[triggers]
crons = [
  "*/30 * * * *"
]
