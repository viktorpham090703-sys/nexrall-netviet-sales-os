# Cấu hình CHỈ dùng để chạy local. Khi deploy thật, nền tảng Nexrall tự cấp
# binding DB / SHARED_KV và tự gọi hàm handle() trong server.js.
name = "netviet-sales-os"
main = "local/entry.js"
compatibility_date = "2026-01-01"

# Front-end tĩnh (index.html + src/ + styles/) được sync sang ./public
# bằng `npm run assets`. Request không khớp file tĩnh sẽ rơi vào Worker (/api/*).
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 — chạy --local nên DB nằm trong .wrangler/state, không cần tài khoản Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "netviet-sales-os"
database_id = "79b5d7cc-4121-499e-bab0-cbbdabc53221"

[[kv_namespaces]]
binding = "SHARED_KV"
id = "3c09fbd8cbd24f0aa11150366b80892e"

# R2 — lưu file gốc (báo giá/hợp đồng) do người dùng upload ở Sales Kit.
# Trên Nexrall cần binding R2 tên "DOCS" tương ứng (nền tảng tự cấp, giống DB/SHARED_KV).
[[r2_buckets]]
binding = "DOCS"
bucket_name = "netviet-sales-os-docs"

# Lịch quét tự động (M10 Automation): mỗi 30 phút gọi /api/__cron
# Trên Nexrall cần khai báo scheduled trigger tương đương.
[triggers]
crons = ["*/30 * * * *"]
