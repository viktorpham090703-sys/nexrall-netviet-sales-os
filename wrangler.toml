# Cấu hình dùng cho CẢ local (`npm run dev`) LẪN deploy production qua Cloudflare
# Worker thật: nextrall-netviet-sales-os1

name = "nextrall-netviet-sales-os1"
main = "local/entry.js"
compatibility_date = "2026-09-01"

# Front-end tĩnh (index.html + src/ + styles/) được build vào ./public
# Request không khớp file tĩnh sẽ rơi vào Worker (/api/*)
[assets]
directory = "./public"
not_found_handling = "single-page-application"


# D1 Database
# Local:
#   wrangler dev --local
# Production:
#   wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "netviet-sales-os"
database_id = "79b5d7cc-4121-499e-bab0-cbbdabc53221"


# Cloudflare KV
[[kv_namespaces]]
binding = "SHARED_KV"
id = "3c09fbd8cbd24f0aa11150366b80892e"


# Cloudflare R2
# Lưu file gốc: báo giá / hợp đồng / tài liệu Sales Kit
[[r2_buckets]]
binding = "DOCS"
bucket_name = "netviet-sales-os-docs"


# Cron Trigger
# M10 Automation: mỗi 30 phút gọi /api/__cron
[triggers]
crons = [
  "*/30 * * * *"
]
